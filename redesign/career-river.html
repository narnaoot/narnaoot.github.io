<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Career River — Nabil Arnaoot</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #FFFBF5; --surface: #FFFFFF; --warm2: #FDECD6;
      --text: #3D2B1F; --muted: #9A8070; --border: #E8DDD0;
      --coral: #E8614F; --teal: #2DB5A8; --mustard: #D4920A;
      --sage: #6A9F7A; --lavender: #8B7BC8;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #A8D8F0; color: var(--text); font-family: 'Nunito', sans-serif; }

    /* Nav */
    .topnav { background: white; border-bottom: 1.5px solid var(--border); position: sticky; top: 0; z-index: 100; height: 56px; display: flex; align-items: center; }
    .topnav-inner { max-width: 1080px; margin: 0 auto; padding: 0 28px; width: 100%; display: flex; align-items: center; justify-content: space-between; }
    .nav-logo { font-family: 'Playfair Display', serif; font-size: 1.25rem; font-weight: 900; color: var(--coral); letter-spacing: -0.5px; text-decoration: none; }
    .nav-links { display: flex; gap: 4px; list-style: none; }
    .nav-links a { padding: 6px 14px; font-size: .78rem; font-weight: 800; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); text-decoration: none; border-radius: 8px; transition: color .15s, background .15s; }
    .nav-links a:hover { color: var(--text); background: var(--warm2); }

    /* Page header */
    .page-header { background: white; text-align: center; padding: 28px 20px 16px; border-bottom: 1.5px solid var(--border); }
    .page-header h1 { font-family: 'Playfair Display', serif; font-size: 2rem; font-weight: 900; color: var(--text); }
    .page-header p { color: var(--muted); margin-top: 6px; font-size: .95rem; }

    /* Scene */
    .scene-wrap { display: flex; justify-content: center; background: #A8D8F0; padding-bottom: 48px; }
    .river-scene { max-width: 900px; width: 100%; height: auto; display: block; }

    /* Caption */
    .caption { text-align: center; padding: 16px 20px 40px; background: #A8D8F0; font-size: .88rem; color: #2A4A6A; font-style: italic; }

    /* Tube float animation */
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50%       { transform: translateY(-5px); }
    }
    .tube-person { animation: float 3s ease-in-out infinite; }

    /* Ripple animation */
    @keyframes ripple {
      0%   { opacity: 0.5; transform: scale(1); }
      100% { opacity: 0; transform: scale(1.8); }
    }
    .ripple { animation: ripple 2s ease-out infinite; transform-origin: center; }
    .ripple2 { animation: ripple 2s ease-out 1s infinite; transform-origin: center; }
  </style>
</head>
<body>

<nav class="topnav">
  <div class="topnav-inner">

    <ul class="nav-links">

</nav>

<div class="page-header">

  <p>Six stops, nineteen years, one very winding ride &mdash; 2006 &rarr; present</p>

<div class="scene-wrap">
<svg class="river-scene" viewBox="0 0 900 1000" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%"   stop-color="#7EC8E3"/>
    <stop offset="45%"  stop-color="#B8E0F5"/>
    <stop offset="100%" stop-color="#C8EED8"/>
  </linearGradient>
  <linearGradient id="grassGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%"   stop-color="#7EC842"/>
    <stop offset="100%" stop-color="#5A9E28"/>
  </linearGradient>
  <linearGradient id="waterGrad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%"   stop-color="#38B6E0"/>
    <stop offset="50%"  stop-color="#2DB5A8"/>
    <stop offset="100%" stop-color="#38B6E0"/>
  </linearGradient>
  <linearGradient id="waterShimmer" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%"   stop-color="#72D4F0" stop-opacity="0.6"/>
    <stop offset="100%" stop-color="#2DB5A8" stop-opacity="0"/>
  </linearGradient>
  <!-- Card backgrounds -->
  <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="120%">
    <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#1A3A2A" flood-opacity="0.18"/>

</defs>

<!-- ══════════════════════════════════════════════
     RIVER — winding S-curve, top-left to bottom-right
     The river bends at each career stop:
       Start  (80,155)  → eBay bend (780,215)
       →  Apple PM bend (825,390)
       →  Apple Process bend (350,478)
       →  St Mary's bend (168,654)
       →  SFMTA end (805,960)

     3D bank technique:
       1. Wide dark-green stroke = earth/bank depth (cliff edge)
       2. Medium blue stroke    = water surface
       3. Narrow light stroke   = shimmer/highlight
     ══════════════════════════════════════════════ -->

<!-- The shared river centerline path (reused 3×) -->

<path
  d="M 80,155
     C 260,108 598,122 778,216
     C 852,256 872,346 826,392
     C 784,436 478,452 348,480
     C 218,508 143,574 166,656
     C 190,728 428,764 604,780
     C 742,792 822,842 806,962"

  stroke="#2A7030"
  stroke-width="114"
  stroke-linecap="round"
  stroke-linejoin="round"
/>

<!-- Layer 2: Water surface — bright blue, slightly narrower -->
<path
  d="M 80,155
     C 260,108 598,122 778,216
     C 852,256 872,346 826,392
     C 784,436 478,452 348,480
     C 218,508 143,574 166,656
     C 190,728 428,764 604,780
