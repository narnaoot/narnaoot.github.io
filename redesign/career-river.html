  <style>
    :root {
      --bg: #FFFBF5; --surface: #FFFFFF; --warm2: #FDECD6;
      --text: #3D2B1F; --muted: #9A8070; --border: #E8DDD0;
      --coral: #E8614F; --teal: #2DB5A8; --mustard: #D4920A;
      --sage: #6A9F7A; --lavender: #8B7BC8;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #A8D8F0; color: var(--text); font-family: 'Nunito', sans-serif; }

    /* Nav */
    .topnav { background: white; border-bottom: 1.5px solid var(--border); position: sticky; top: 0; z-index: 100; height: 56px; display: flex; align-items: center; }
    .topnav-inner { max-width: 1080px; margin: 0 auto; padding: 0 28px; width: 100%; display: flex; align-items: center; justify-content: space-between; }
    .nav-logo { font-family: 'Playfair Display', serif; font-size: 1.25rem; font-weight: 900; color: var(--coral); letter-spacing: -0.5px; text-decoration: none; }
    .nav-links { display: flex; gap: 4px; list-style: none; }
    .nav-links a { padding: 6px 14px; font-size: .78rem; font-weight: 800; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); text-decoration: none; border-radius: 8px; transition: color .15s, background .15s; }
    .nav-links a:hover { color: var(--text); background: var(--warm2); }

    /* Page header */
    .page-header { background: white; text-align: center; padding: 28px 20px 16px; border-bottom: 1.5px solid var(--border); }
    .page-header h1 { font-family: 'Playfair Display', serif; font-size: 2rem; font-weight: 900; color: var(--text); }
    .page-header p { color: var(--muted); margin-top: 6px; font-size: .95rem; }

    /* Scene */
    .scene-wrap { display: flex; justify-content: center; background: #A8D8F0; padding-bottom: 48px; }
    .river-scene { max-width: 900px; width: 100%; height: auto; display: block; }

    /* Caption */
    .caption { text-align: center; padding: 16px 20px 40px; background: #A8D8F0; font-size: .88rem; color: #2A4A6A; font-style: italic; }

    /* Tube float animation */
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50%       { transform: translateY(-5px); }
    }
    .tube-person { animation: float 3s ease-in-out infinite; }

    /* Ripple animation */
    @keyframes ripple {
      0%   { opacity: 0.5; transform: scale(1); }
      100% { opacity: 0; transform: scale(1.8); }
    }
    .ripple { animation: ripple 2s ease-out infinite; transform-origin: center; }
    .ripple2 { animation: ripple 2s ease-out 1s infinite; transform-origin: center; }
  </style>
</head>
