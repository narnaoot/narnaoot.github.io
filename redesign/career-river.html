  <style>

    /* Nav */
    .topnav {

    .topnav-inner {
      max-width: 1080px; margin: 0 auto; padding: 0 28px;

    }
    .nav-logo {

      font-weight: 900; color: #E8614F; letter-spacing: -0.5px; text-decoration: none;

    }

      font-family: 'Playfair Display', serif;
      font-size: 2.2rem; font-weight: 900; color: #3D2B1F;
      text-shadow: 0 2px 8px rgba(255,255,255,0.5);
    }
    .title-block p {
      font-size: .95rem; color: #5A4030;
      margin-top: 6px; font-weight: 600;
    }

    .river-wrap {
      background: white;
      border-radius: 24px;
      padding: 12px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.18), 0 2px 8px rgba(0,0,0,0.1);
      max-width: 520px;
      width: 100%;
    }
    .river-wrap img {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 16px;
    }

    /* Caption */
    .caption {
      margin-top: 20px;
      text-align: center;

<nav class="topnav">
