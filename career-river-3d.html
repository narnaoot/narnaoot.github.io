<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Career River — Nabil Arnaoot</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #87C8E8; font-family: 'Nunito', sans-serif; overflow: hidden; }

    /* Nav */
    .topnav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      background: white; border-bottom: 1.5px solid #E8DDD0;
      height: 56px; display: flex; align-items: center;
    }
    .topnav-inner {
      max-width: 1080px; margin: 0 auto; padding: 0 28px;
      width: 100%; display: flex; align-items: center; justify-content: space-between;
    }
    .nav-logo {
      font-family: 'Playfair Display', serif; font-size: 1.25rem;
      font-weight: 900; color: #E8614F; letter-spacing: -0.5px; text-decoration: none;
    }
    .nav-links { display: flex; gap: 4px; list-style: none; }
    .nav-links a {
      padding: 6px 14px; font-size: .78rem; font-weight: 800;
      letter-spacing: .09em; text-transform: uppercase; color: #9A8070;
      text-decoration: none; border-radius: 8px;
    }
    .nav-links a:hover { color: #3D2B1F; background: #FDECD6; }

    /* Three.js canvas container */
    #canvas-wrap {
      position: fixed; top: 56px; left: 0; right: 0;
      bottom: 0; width: 100%; height: calc(100vh - 56px);
    }
    #canvas-wrap canvas { display: block; width: 100% !important; height: 100% !important; }

    /* HTML labels layer — sits on top of canvas, pointer-events:none */
    #labels {
      position: fixed; top: 56px; left: 0; right: 0; bottom: 0;
      pointer-events: none; overflow: hidden;
    }
    .stop-label {
      position: absolute;
      background: rgba(255,255,255,0.93);
      border-radius: 10px;
      padding: 8px 14px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.15);
      transform: translate(-50%, -100%);
      white-space: nowrap;
      pointer-events: none;
    }
    .stop-label .name {
      font-family: 'Playfair Display', serif;
      font-size: 13px; font-weight: 700; color: #3D2B1F;
      display: block;
    }
    .stop-label .dates {
      font-size: 10px; color: #9A8070; display: block; margin-top: 1px;
    }
    .stop-label .role {
      font-size: 10px; font-weight: 800; display: block; margin-top: 2px;
    }

    /* Title card */
    #title-card {
      position: fixed; top: 72px; left: 50%; transform: translateX(-50%);
      background: rgba(255,255,255,0.93);
      border-radius: 26px; padding: 10px 28px 12px;
      box-shadow: 0 3px 16px rgba(0,0,0,0.13);
      text-align: center; pointer-events: none; z-index: 50;
    }
    #title-card h1 {
      font-family: 'Playfair Display', serif;
      font-size: 1.5rem; font-weight: 900; color: #3D2B1F;
    }
    #title-card p { font-size: .82rem; color: #9A8070; margin-top: 2px; }
  </style>
</head>

<nav class="topnav">
  <div class="topnav-inner">
    <a href="index.html" class="nav-logo">NA</a>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>

<div id="canvas-wrap"></div>
<div id="labels"></div>

<div id="title-card">
  <h1>The Career River</h1>
  <p>Six stops · Nineteen years · One winding ride — 2006 → present</p>
</div>

<!-- Three.js r160 -->
<script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>

<script>
// ═══════════════════════════════════════════════════════════
//  CHUNK 1 — Scene foundation: camera, lighting, terrain
// ═══════════════════════════════════════════════════════════

const container = document.getElementById('canvas-wrap');

// ── Renderer ──────────────────────────────────────────────
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(container.clientWidth, container.clientHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
container.appendChild(renderer.domElement);

// ── Scene ──────────────────────────────────────────────────
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87C8E8); // AC sky blue
scene.fog = new THREE.FogExp2(0xA8D8F0, 0.022);

// ── Camera: orthographic isometric (like Animal Crossing) ──
//    Looking from upper-left-back, down at ~35°
const W = container.clientWidth;
const H = container.clientHeight;
const aspect = W / H;
const camSize = 14;
const camera = new THREE.OrthographicCamera(
  -camSize * aspect,  camSize * aspect,
   camSize,          -camSize,
  0.1, 200
);
// Isometric position: equal X, Y, Z offset → classic 45° iso view
camera.position.set(-20, 20, 20);
camera.lookAt(0, 0, 0);

// ── Lighting ───────────────────────────────────────────────
// Hemisphere light: sky colour top, ground colour bottom
const hemi = new THREE.HemisphereLight(0xB8E0FF, 0x6BAD30, 0.65);
scene.add(hemi);

// Main sun: warm directional light with shadows
const sun = new THREE.DirectionalLight(0xFFF8E0, 1.3);
sun.position.set(12, 28, 8);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.near = 1;
sun.shadow.camera.far  = 80;
sun.shadow.camera.left   = -22;
sun.shadow.camera.right  =  22;
sun.shadow.camera.top    =  22;
sun.shadow.camera.bottom = -22;
sun.shadow.bias = -0.0008;
scene.add(sun);

// Fill light from the opposite side (softens shadows like AC)
const fill = new THREE.DirectionalLight(0xD0E8FF, 0.4);
fill.position.set(-10, 10, -10);
scene.add(fill);

// ── Terrain ────────────────────────────────────────────────
// A 50×50 unit plane, subdivided so we can add hills at edges
const terrainGeo = new THREE.PlaneGeometry(50, 50, 48, 48);
terrainGeo.rotateX(-Math.PI / 2); // Lay flat on XZ

// Gently raise edges to form rolling hills; keep river valley flat
const pos = terrainGeo.attributes.position;
for (let i = 0; i < pos.count; i++) {
  const x = pos.getX(i);
  const z = pos.getZ(i);
  // Distance from centre
  const r = Math.sqrt(x * x + z * z);
  // Hill height only kicks in outside radius 10; gentle sine bumps
  const hill  = Math.max(0, (r - 9) * 0.12);
  const bumps = Math.sin(x * 0.45) * Math.cos(z * 0.45) * 0.28;
  pos.setY(i, hill + bumps * Math.min(1, r / 8));
}
terrainGeo.computeVertexNormals();

const terrainMat = new THREE.MeshLambertMaterial({ color: 0x72BB3A });
const terrain = new THREE.Mesh(terrainGeo, terrainMat);
terrain.receiveShadow = true;
scene.add(terrain);

// Slightly darker inner ground ring (the flat valley floor)
const valleyGeo = new THREE.CircleGeometry(10, 64);
valleyGeo.rotateX(-Math.PI / 2);
const valleyMat = new THREE.MeshLambertMaterial({ color: 0x7BC842 });
const valley = new THREE.Mesh(valleyGeo, valleyMat);
valley.position.y = 0.01;
valley.receiveShadow = true;
scene.add(valley);

// ── Clouds (simple flat ellipsoids high in the scene) ─────
function makeCloud(x, y, z) {
  const g = new THREE.Group();
  const mat = new THREE.MeshLambertMaterial({ color: 0xFFFFFF });
  [[0,0,0,2.2,1,2.2],[1.8,0.3,0,1.8,0.85,1.8],[-1.8,0.3,0,1.8,0.85,1.8],[0,0.5,0,1.4,0.8,1.4]]
    .forEach(([cx,cy,cz,sx,sy,sz]) => {
      const m = new THREE.Mesh(new THREE.SphereGeometry(1, 8, 6), mat);
      m.position.set(cx,cy,cz); m.scale.set(sx,sy,sz);
      g.add(m);
    });
  g.position.set(x, y, z);
  g.scale.set(0.9, 0.9, 0.9);
  scene.add(g);
  return g;
}
const clouds = [
  makeCloud(-12, 14,  -8),
  makeCloud(  6, 16, -12),
  makeCloud( 14, 13,   4),
  makeCloud( -8, 15,  10),
];

// ═══════════════════════════════════════════════════════════
//  CHUNK 2 — River: ribbon mesh along winding S-curve
// ═══════════════════════════════════════════════════════════

// River control points — S-curve winding through the scene.
// These also define where career stops sit (at the bends).
const riverPoints = [
  new THREE.Vector3(-9,  0, -9),   // 0 — Elegrity (start, top-left)
  new THREE.Vector3(-4,  0, -8),
  new THREE.Vector3( 2,  0, -7),
  new THREE.Vector3( 7,  0, -5),   // 3 — eBay (upper-right bend)
  new THREE.Vector3( 9,  0, -2),
  new THREE.Vector3( 8,  0,  1),   // 5 — Apple Eng PM (right bend)
  new THREE.Vector3( 5,  0,  2),
  new THREE.Vector3( 0,  0,  2.5),
  new THREE.Vector3(-5,  0,  3),   // 8 — Apple Process (centre-left)
  new THREE.Vector3(-8,  0,  4),
  new THREE.Vector3(-9,  0,  6.5), // 10 — St Mary's (lower-left bend)
  new THREE.Vector3(-7,  0,  8),
  new THREE.Vector3(-3,  0,  9),
  new THREE.Vector3( 4,  0,  9.5), // 13 — SFMTA (lower-right, end)
];

const riverCurve = new THREE.CatmullRomCurve3(riverPoints, false, 'catmullrom', 0.5);

// ── Build ribbon mesh ──────────────────────────────────────
// Sample the curve densely, then create a flat strip RIVER_W wide.
const RIVER_W  = 2.2;   // river width in world units
const N_SEGS   = 180;   // smoothness

const curvePts  = riverCurve.getSpacedPoints(N_SEGS);
const verts     = [];
const uvs       = [];
const indices   = [];

for (let i = 0; i < curvePts.length; i++) {
  const p = curvePts[i];

  // Tangent direction along the curve (horizontal only)
  let tx, tz;
  if (i < curvePts.length - 1) {
    tx = curvePts[i+1].x - p.x;
    tz = curvePts[i+1].z - p.z;
  } else {
    tx = p.x - curvePts[i-1].x;
    tz = p.z - curvePts[i-1].z;
  }
  const len = Math.sqrt(tx*tx + tz*tz) || 1;
  tx /= len; tz /= len;
  // Perpendicular (rotate 90° in XZ)
  const px = -tz, pz = tx;

  const u = i / (curvePts.length - 1);
  // Left bank vertex
  verts.push(p.x - px * RIVER_W/2, 0.02, p.z - pz * RIVER_W/2);
  uvs.push(0, u);
  // Right bank vertex
  verts.push(p.x + px * RIVER_W/2, 0.02, p.z + pz * RIVER_W/2);
  uvs.push(1, u);

  if (i > 0) {
    const b = (i-1) * 2;
    indices.push(b, b+1, b+2, b+1, b+3, b+2);
  }
}

const riverGeo = new THREE.BufferGeometry();
riverGeo.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));
riverGeo.setAttribute('uv',       new THREE.Float32BufferAttribute(uvs, 2));
riverGeo.setIndex(indices);
riverGeo.computeVertexNormals();

// Dark AC-style navy-blue water material, slightly shiny
const riverMat = new THREE.MeshPhongMaterial({
  color:     0x1A4F82,
  emissive:  0x0A2040,
  specular:  0x4080C0,
  shininess: 60,
});
const riverMesh = new THREE.Mesh(riverGeo, riverMat);
riverMesh.receiveShadow = true;
scene.add(riverMesh);

// ── Bank strips: slightly darker grass edging the river ───
// Widen the same curve a bit more, placed just under the river
const BANK_W = RIVER_W + 1.0;
const bankVerts = [];
const bankIdx   = [];
for (let i = 0; i < curvePts.length; i++) {
  const p = curvePts[i];
  let tx, tz;
  if (i < curvePts.length - 1) { tx = curvePts[i+1].x-p.x; tz = curvePts[i+1].z-p.z; }
  else                          { tx = p.x-curvePts[i-1].x; tz = p.z-curvePts[i-1].z; }
  const len = Math.sqrt(tx*tx+tz*tz)||1; tx/=len; tz/=len;
  const px = -tz, pz = tx;
  bankVerts.push(p.x - px*BANK_W/2, 0.005, p.z - pz*BANK_W/2);
  bankVerts.push(p.x + px*BANK_W/2, 0.005, p.z + pz*BANK_W/2);
  if (i > 0) { const b=(i-1)*2; bankIdx.push(b,b+1,b+2,b+1,b+3,b+2); }
}
const bankGeo = new THREE.BufferGeometry();
bankGeo.setAttribute('position', new THREE.Float32BufferAttribute(bankVerts, 3));
bankGeo.setIndex(bankIdx);
bankGeo.computeVertexNormals();
const bankMesh = new THREE.Mesh(bankGeo,
  new THREE.MeshLambertMaterial({ color: 0x4A9020 })); // darker bank green
bankMesh.receiveShadow = true;
scene.add(bankMesh);

// ═══════════════════════════════════════════════════════════
//  CHUNK 3 — Trees: round AC-style canopies + trunks
// ═══════════════════════════════════════════════════════════

function makeTree(x, z, scale = 1) {
  const g = new THREE.Group();

  // Trunk
  const trunkGeo = new THREE.CylinderGeometry(0.12*scale, 0.18*scale, 0.9*scale, 7);
  const trunkMat = new THREE.MeshLambertMaterial({ color: 0x8B5E2A });
  const trunk = new THREE.Mesh(trunkGeo, trunkMat);
  trunk.position.y = 0.45 * scale;
  trunk.castShadow = true;
  g.add(trunk);

  // Canopy — 3 overlapping spheres for that AC puffy look
  const canopyMat  = new THREE.MeshLambertMaterial({ color: 0x52A830 });
  const canopyMat2 = new THREE.MeshLambertMaterial({ color: 0x40941E }); // slightly darker lower sphere
  const canopyMat3 = new THREE.MeshLambertMaterial({ color: 0x68C040 }); // lighter top

  const makeBlob = (r, cx, cy, cz, mat) => {
    const m = new THREE.Mesh(new THREE.SphereGeometry(r, 9, 7), mat);
    m.position.set(cx, cy, cz);
    m.castShadow = true;
    g.add(m);
  };

  const base = 0.9 * scale;
  makeBlob(0.72*scale, 0,           base + 0.58*scale, 0,           canopyMat);
  makeBlob(0.58*scale,-0.4*scale,   base + 0.28*scale, 0.1*scale,   canopyMat2);
  makeBlob(0.58*scale, 0.38*scale,  base + 0.28*scale,-0.1*scale,   canopyMat2);
  makeBlob(0.46*scale, 0,           base + 1.08*scale, 0,           canopyMat3);

  // Terrain height at this position (approximate — just sample Y=0 since valley is flat)
  g.position.set(x, 0, z);
  scene.add(g);
  return g;
}

// Place trees along the river banks, offset so they don't overlap the water.
// We sample points on the curve and step perpendicular to place trees.
const treePositions = [
  // Left bank of upper stretch
  [-7.5, -10.5], [-5, -9.5], [-2, -8.5],
  // Right bank of upper stretch
  [ 3, -9], [ 6, -7], [ 8.5, -5.5],
  // Right bank right bend
  [10.5, -2.5], [10.5, 0.5],
  // Upper left bank after bend
  [ 3.5, 4], [ 1, 4.5],
  // Lower left bank
  [-3.5, 4.5], [-7, 5.5], [-10.5, 5],
  // Below lower-left bend
  [-10.5, 7.5], [-8, 9.5], [-6, 10.5],
  // Right side lower stretch
  [ 2, 10.5], [ 6, 10.5],
  // Extra scattered
  [-11, -6], [-11, -2], [ 11, 3], [ 11, 6],
  [-4, -11], [ 1, -11], [ 8, -8],
];

treePositions.forEach(([x, z], i) => {
  const s = 0.75 + Math.random() * 0.55;
  makeTree(x + (Math.random()-0.5)*0.4, z + (Math.random()-0.5)*0.4, s);
});

// ═══════════════════════════════════════════════════════════
//  CHUNK 4 — Career stop buildings
//  Each stop: a coloured box body + contrasting roof prism
//  Positions are beside the river bends (riverPoints indices)
// ═══════════════════════════════════════════════════════════

// stop index in riverPoints → world offset from the curve
const stopDefs = [
  { idx: 0,  side: -1, name: 'Elegrity',     bodyColor: 0xE8614F, roofColor: 0xC03828 },
  { idx: 3,  side:  1, name: 'eBay',         bodyColor: 0xD4920A, roofColor: 0xA06808 },
  { idx: 5,  side:  1, name: 'Apple PM',     bodyColor: 0x8B7BC8, roofColor: 0x5A4A98 },
  { idx: 8,  side: -1, name: 'Apple Process',bodyColor: 0x7B6BC8, roofColor: 0x4A3A88 },
  { idx: 10, side: -1, name: "St. Mary's",   bodyColor: 0x6A9F7A, roofColor: 0x3A6A4A },
  { idx: 13, side:  1, name: 'SFMTA',        bodyColor: 0x2DB5A8, roofColor: 0x1A8070 },
];

// Keep refs for label projection later
const stopObjects = [];

stopDefs.forEach((def) => {
  const pt = riverPoints[def.idx];

  // Perpendicular direction at this curve point
  const nextPt = riverPoints[Math.min(def.idx + 1, riverPoints.length - 1)];
  const prevPt = riverPoints[Math.max(def.idx - 1, 0)];
  const tx = nextPt.x - prevPt.x;
  const tz = nextPt.z - prevPt.z;
  const len = Math.sqrt(tx*tx + tz*tz) || 1;
  // Perpendicular (rotate 90°)
  const px = -tz / len;
  const pz =  tx / len;

  const offset = 2.4; // distance from river edge
  const bx = pt.x + px * def.side * offset;
  const bz = pt.z + pz * def.side * offset;

  const g = new THREE.Group();
  g.position.set(bx, 0, bz);

  // ── Body ──────────────────────────────────────────────
  const bodyH = def.name === 'Apple PM' ? 1.6 : 1.1; // Apple PM a bit taller
  const bodyGeo = new THREE.BoxGeometry(1.4, bodyH, 1.4);
  const bodyMat = new THREE.MeshLambertMaterial({ color: def.bodyColor });
  const body    = new THREE.Mesh(bodyGeo, bodyMat);
  body.position.y = bodyH / 2;
  body.castShadow = true;
  body.receiveShadow = true;
  g.add(body);

  // ── Roof (triangular prism) ────────────────────────────
  const roofGeo = new THREE.ConeGeometry(1.1, 0.7, 4);
  const roofMat = new THREE.MeshLambertMaterial({ color: def.roofColor });
  const roof    = new THREE.Mesh(roofGeo, roofMat);
  roof.position.y = bodyH + 0.35;
  roof.rotation.y = Math.PI / 4; // align flat edges with building
  roof.castShadow = true;
  g.add(roof);

  // ── Windows (small lighter boxes on front face) ────────
  const winMat = new THREE.MeshLambertMaterial({ color: 0xFFF8E8, emissive: 0x403020 });
  [[-0.35, bodyH*0.6], [0.35, bodyH*0.6], [0, bodyH*0.25]].forEach(([wx, wy]) => {
    const wm = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.22, 0.05), winMat);
    wm.position.set(wx, wy, 0.73);
    g.add(wm);
  });

  // ── SFMTA special: add a tiny cable car on top ─────────
  if (def.name === 'SFMTA') {
    const carGeo = new THREE.BoxGeometry(0.55, 0.28, 0.28);
    const carMat = new THREE.MeshLambertMaterial({ color: 0xE8614F });
    const car    = new THREE.Mesh(carGeo, carMat);
    car.position.y = bodyH + 0.8;
    car.castShadow = true;
    g.add(car);
  }

  // ── Apple PM special: concentric ring on top ───────────
  if (def.name === 'Apple PM') {
    const ringGeo = new THREE.TorusGeometry(0.55, 0.08, 6, 20);
    const ringMat = new THREE.MeshLambertMaterial({ color: 0xC0B0F0 });
    const ring    = new THREE.Mesh(ringGeo, ringMat);
    ring.position.y = 0.2;
    ring.rotation.x = Math.PI / 2;
    ring.castShadow = true;
    g.add(ring);
  }

  scene.add(g);
  stopObjects.push({ group: g, def, worldPos: new THREE.Vector3(bx, bodyH, bz) });
});

// ═══════════════════════════════════════════════════════════
//  CHUNK 5 — Character in a tube floating down the river
//  Torus (inner tube) + Sphere (head) + Sphere (body)
//  Travels along the river curve, bobs gently
// ═══════════════════════════════════════════════════════════

// Character group
const character = new THREE.Group();
scene.add(character);

// Inner tube — flat torus lying horizontal
const tubeGeo = new THREE.TorusGeometry(0.42, 0.14, 8, 24);
const tubeMat = new THREE.MeshPhongMaterial({ color: 0xF4A040, shininess: 60 });
const tube    = new THREE.Mesh(tubeGeo, tubeMat);
tube.rotation.x = Math.PI / 2;
tube.castShadow = true;
character.add(tube);

// Body — sphere sitting in the tube
const bodyGeo2 = new THREE.SphereGeometry(0.24, 10, 10);
const bodyMat2 = new THREE.MeshLambertMaterial({ color: 0x4A90D9 }); // blue shirt
const bodyMesh = new THREE.Mesh(bodyGeo2, bodyMat2);
bodyMesh.position.y = 0.18;
bodyMesh.castShadow = true;
character.add(bodyMesh);

// Head
const headGeo = new THREE.SphereGeometry(0.18, 10, 10);
const headMat = new THREE.MeshLambertMaterial({ color: 0xF5CBA7 }); // skin tone
const headMesh = new THREE.Mesh(headGeo, headMat);
headMesh.position.y = 0.52;
headMesh.castShadow = true;
character.add(headMesh);

// Arms — two small capsule-ish spheres draped over tube sides
[[-0.44, 0.12, 0], [0.44, 0.12, 0]].forEach(([ax, ay, az]) => {
  const armGeo = new THREE.SphereGeometry(0.1, 6, 6);
  const armMat = new THREE.MeshLambertMaterial({ color: 0x4A90D9 });
  const arm    = new THREE.Mesh(armGeo, armMat);
  arm.position.set(ax, ay, az);
  arm.castShadow = true;
  character.add(arm);
});

// The character travels along the river curve over time
// We'll advance a t parameter slowly, looping 0→1
let charT = 0.05; // start just after beginning

// ═══════════════════════════════════════════════════════════
//  CHUNK 6 — HTML labels, water shimmer, final polish
// ═══════════════════════════════════════════════════════════

// Stop metadata for labels
const stopMeta = [
  { name: 'Elegrity',      dates: '2006 – 2010', role: 'Analyst / PM',          color: '#E8614F' },
  { name: 'eBay',          dates: '2010 – 2011', role: 'Program Manager',        color: '#D4920A' },
  { name: 'Apple (PM)',    dates: '2011 – 2014', role: 'Engineering PM',         color: '#8B7BC8' },
  { name: 'Apple (Ops)',   dates: '2014 – 2020', role: 'Process Engineer',       color: '#7B6BC8' },
  { name: "St. Mary's",    dates: '2020 – 2024', role: 'Instructor / Consultant',color: '#6A9F7A' },
  { name: 'SFMTA',         dates: '2024 – now',  role: 'Sr. Program Analyst',    color: '#2DB5A8' },
];

// Build label DOM elements
const labelsEl = document.getElementById('labels');
const labelEls = stopObjects.map((stop, i) => {
  const meta = stopMeta[i];
  const el = document.createElement('div');
  el.className = 'stop-label';
  el.innerHTML = `
    <span class="name" style="color:${meta.color}">${meta.name}</span>
    <span class="role">${meta.role}</span>
    <span class="dates">${meta.dates}</span>
  `;
  labelsEl.appendChild(el);
  return el;
});

// Water shimmer: animate the river material's emissive to pulse
// riverMesh was built in chunk 2
const _waterBaseEmissive = new THREE.Color(0x0A2A50);
const _waterShimmer      = new THREE.Color(0x1A4A80);

// Helper: project a 3D world position into label's CSS px coords
const _projVec = new THREE.Vector3();
function projectToScreen(worldPos) {
  _projVec.copy(worldPos);
  _projVec.project(camera);
  const rect = container.getBoundingClientRect();
  return {
    x: (_projVec.x * 0.5 + 0.5) * rect.width,
    y: (-_projVec.y * 0.5 + 0.5) * rect.height,
  };
}

// ── Resize handling ────────────────────────────────────────
window.addEventListener('resize', () => {
  const w = container.clientWidth;
  const h = container.clientHeight;
  const a = w / h;
  camera.left   = -camSize * a;
  camera.right  =  camSize * a;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
});

// ═══════════════════════════════════════════════════════════
//  ANIMATION LOOP
// ═══════════════════════════════════════════════════════════
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();

  // Slowly drift clouds
  clouds.forEach((c, i) => {
    c.position.x += 0.003 * (i % 2 === 0 ? 1 : -0.6);
  });

  // Advance character along river (full loop every ~40 s)
  charT = (charT + 0.0004) % 1;
  const charPos  = riverCurve.getPointAt(charT);
  const charTan  = riverCurve.getTangentAt(charT);

  // Place character on water surface with gentle bob
  character.position.set(charPos.x, 0.18 + Math.sin(t * 2.2) * 0.04, charPos.z);

  // Face along direction of travel
  const angle = Math.atan2(charTan.x, charTan.z);
  character.rotation.y = angle;

  // Gentle rock side-to-side
  character.rotation.z = Math.sin(t * 3.1) * 0.08;

  // Water shimmer — pulse emissive intensity
  const shimmer = 0.5 + 0.5 * Math.sin(t * 1.8);
  riverMesh.material.emissive.lerpColors(_waterBaseEmissive, _waterShimmer, shimmer * 0.35);
  riverMesh.material.emissiveIntensity = 0.25 + shimmer * 0.15;

  // Render first so camera matrices are fresh for projection
  renderer.render(scene, camera);

  // Project stop buildings to screen and position labels above them
  stopObjects.forEach((stop, i) => {
    const sc = projectToScreen(stop.worldPos);
    const el = labelEls[i];
    el.style.left = sc.x + 'px';
    el.style.top  = (sc.y - 8) + 'px';
  });
}
animate();
</script>
