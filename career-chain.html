<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Career Thread — Nabil Arnaoot</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg:      #FFFBF5;
      --surface: #FFFFFF;
      --text:    #3D2B1F;
      --muted:   #9A8070;
      --border:  #E8DDD0;
      --r: 14px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Nunito', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 52px 24px;
    }
    .section-wrap { width: 100%; max-width: 1160px; }
    .eyebrow {
      font-size: .7rem;
      font-weight: 800;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 8px;
    }
    h2 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(1.6rem, 4vw, 2.2rem);
      font-weight: 900;
      color: var(--text);
      margin-bottom: 6px;
    }
    .subtitle {
      font-size: .92rem;
      color: var(--muted);
      font-weight: 600;
      margin-bottom: 28px;
    }
    .chain-outer {
      border: 1.5px solid var(--border);
      border-radius: var(--r);
      background: var(--surface);
      padding: 24px 20px 18px;
      overflow-x: auto;
    }
    #chainSvg {
      min-width: 760px;
      width: 100%;
      height: auto;
      display: block;
    }
  </style>
</head>
<body>

<div class="section-wrap">
  <p class="eyebrow">Career Thread</p>
  <h2>Not a ladder. A through-line.</h2>
  <p class="subtitle">Each role contributed something the next one required. Vertical position reflects scope of impact.</p>
  <div class="chain-outer">
    <svg id="chainSvg" viewBox="0 0 1200 415" xmlns="http://www.w3.org/2000/svg">
      <title>Nabil Arnaoot career progression, 2006 to present</title>
    </svg>
  </div>
</div>

<script>
(function () {
  const svg = document.getElementById('chainSvg');
  const ns  = 'http://www.w3.org/2000/svg';

  function el(tag, attrs, parent) {
    const e = document.createElementNS(ns, tag);
    for (const [k, v] of Object.entries(attrs || {})) e.setAttribute(k, v);
    if (parent) parent.appendChild(e);
    return e;
  }

  // ── Layout constants ───────────────────────────────────────
  const CW = 112, CH = 68, HW = CW / 2, HH = CH / 2;

  // ── Career data ────────────────────────────────────────────
  // x = horizontal position, y = vertical (lower y = higher scope)
  const roles = [
    { x:  110, y: 345, company: 'Elegrity',   title: 'Engr PM',         years: '2006 – 10', color: '#6A9F7A' },
    { x:  300, y: 310, company: 'eBay',        title: 'Program Mgr',     years: '2010 – 11', color: '#D4920A' },
    { x:  495, y: 248, company: 'Apple',       title: 'Engr PM',         years: '2011 – 14', color: '#4A90D9' },
    { x:  680, y: 262, company: 'Apple',       title: 'BA / BPE',        years: '2014 – 20', color: '#4A90D9', pivot: true },
    { x:  875, y: 190, company: "St. Mary's",  title: 'Consultant + MS', years: '2020 – 24', color: '#8B7BC8' },
    { x: 1075, y: 100, company: 'SFMTA',       title: 'Principal BA',    years: '2024 – now',color: '#E8614F', current: true },
  ];

  // Labels describe what the previous role gave that made this one possible
  const bridges = [
    { label: 'stakeholder craft', pivot: false },
    { label: 'technical fluency', pivot: false },
    { label: 'systems → process', pivot: true  },
    { label: 'formalized skills',  pivot: false },
    { label: 'data leadership',    pivot: false },
  ];

  // ── Defs ──────────────────────────────────────────────────
  const defs = el('defs', {}, svg);

  // Dot grid background pattern
  const pat = el('pattern', { id: 'dg', x: 0, y: 0, width: 24, height: 24, patternUnits: 'userSpaceOnUse' }, defs);
  el('circle', { cx: 1, cy: 1, r: 1, fill: '#E8DDD0' }, pat);

  // Arrowhead markers
  function mkMarker(id, color) {
    const m = el('marker', { id, markerWidth: '9', markerHeight: '9', refX: '8', refY: '3', orient: 'auto' }, defs);
    el('path', { d: 'M0,0 L0,6 L9,3 z', fill: color }, m);
  }
  mkMarker('arN', '#C0B4A8');
  mkMarker('arP', '#C4830A');
  mkMarker('arC', '#D0504A');

  // Bridge paths — defined once in defs, reused for stroke and textPath
  roles.forEach((r, i) => {
    if (i >= roles.length - 1) return;
    const nx = roles[i + 1].x, ny = roles[i + 1].y;
    const x1 = r.x + HW,  y1 = r.y;
    const x2 = nx - HW,   y2 = ny;
    const dx = x2 - x1;
    el('path', {
      id: `bp${i}`,
      d: `M${x1},${y1} C${x1 + dx * .42},${y1} ${x2 - dx * .42},${y2} ${x2},${y2}`,
    }, defs);
  });

  // ── Background ─────────────────────────────────────────────
  el('rect', { x: 0, y: 0, width: 1200, height: 415, fill: '#FFFBF5' }, svg);
  el('rect', { x: 0, y: 0, width: 1200, height: 415, fill: 'url(#dg)', opacity: '.45' }, svg);

  // ── Scope axis (left edge) ─────────────────────────────────
  el('line', { x1: 38, y1: 64, x2: 38, y2: 380, stroke: '#DDD0C0', 'stroke-width': '1', 'stroke-dasharray': '2,7' }, svg);
  el('polygon', { points: '33,59 38,47 43,59', fill: '#CCC0B0' }, svg);

  function axisLbl(text, y) {
    const e = el('text', {
      x: 38, y,
      'text-anchor': 'middle',
      'font-family': 'Nunito,sans-serif',
      'font-size': '8',
      'font-weight': '800',
      'letter-spacing': '.1em',
      fill: '#C0B0A0',
    }, svg);
    e.textContent = text;
  }
  axisLbl('ORG-WIDE', 36);
  axisLbl('TEAM', 396);

  // Faint horizontal scope guide lines
  [92, 185, 278, 370].forEach(y => {
    el('line', { x1: 56, y1: y, x2: 1184, y2: y, stroke: '#ECE5D8', 'stroke-width': '.8', 'stroke-dasharray': '3,14' }, svg);
  });

  // ── Connectors ────────────────────────────────────────────
  bridges.forEach((b, i) => {
    const isLast   = i === bridges.length - 1;
    const stroke   = b.pivot ? '#C4830A' : isLast ? '#D0504A' : '#C4B8AC';
    const markerId = b.pivot ? 'arP'     : isLast ? 'arC'     : 'arN';

    // Visible stroke (references path defined in defs)
    el('use', {
      href: `#bp${i}`,
      fill: 'none',
      stroke,
      'stroke-width': b.pivot ? '2.2' : '1.8',
      'stroke-dasharray': b.pivot ? '7,4' : 'none',
      'marker-end': `url(#${markerId})`,
    }, svg);

    // Bridge label rides the curve via textPath
    // paint-order stroke/fill trick creates a white halo so text is legible over the line
    const tEl = el('text', {
      'font-family': 'Nunito,sans-serif',
      'font-size': '9',
      'font-weight': '700',
      fill: b.pivot ? '#7A5100' : '#A09080',
      'paint-order': 'stroke fill',
      stroke: '#FFFBF5',
      'stroke-width': '5',
      'stroke-linejoin': 'round',
    }, svg);
    const tp = el('textPath', { href: `#bp${i}`, startOffset: '50%', 'text-anchor': 'middle', dy: '-7' }, tEl);
    tp.textContent = b.label;

    // ↩ PIVOT badge above the Apple→Apple connector
    if (b.pivot) {
      const r  = roles[i], nr = roles[i + 1];
      const mx = (r.x + nr.x) / 2;
      const my = (r.y + nr.y) / 2 - 30;
      el('rect', { x: mx - 27, y: my - 9, width: 54, height: 17, rx: '8', fill: '#C4830A' }, svg);
      const bt = el('text', {
        x: mx, y: my + 4,
        'text-anchor': 'middle',
        'font-family': 'Nunito,sans-serif',
        'font-size': '7.5',
        'font-weight': '800',
        'letter-spacing': '.1em',
        fill: '#FFF',
      }, svg);
      bt.textContent = '↩ PIVOT';
    }
  });

  // ── Role cards ────────────────────────────────────────────
  roles.forEach((r, i) => {
    const lx = r.x - HW, ty = r.y - HH;
    const cid = `cc${i}`;

    // Clip path (keeps left-accent color inside card corners)
    const cp = el('clipPath', { id: cid }, defs);
    el('rect', { x: lx, y: ty, width: CW, height: CH, rx: '10' }, cp);

    // Drop shadow
    el('rect', { x: lx + 2, y: ty + 3, width: CW, height: CH, rx: '10', fill: 'rgba(61,43,31,.07)' }, svg);

    // Clipped interior (white bg + color accent bar)
    const cg = el('g', { 'clip-path': `url(#${cid})` }, svg);
    el('rect', { x: lx, y: ty, width: CW, height: CH, fill: '#FFF' }, cg);
    el('rect', { x: lx, y: ty, width: 5, height: CH, fill: r.color }, cg);
    if (r.current) {
      el('rect', { x: lx, y: ty, width: CW, height: 7, fill: r.color, opacity: '.15' }, cg);
    }

    // Card border (colored + slightly thicker for current role)
    el('rect', {
      x: lx, y: ty, width: CW, height: CH, rx: '10',
      fill: 'none',
      stroke: r.current ? r.color : '#E8DDD0',
      'stroke-width': r.current ? '2' : '1.5',
    }, svg);

    // Company name
    const ce = el('text', {
      x: lx + 14, y: ty + 23,
      'font-family': "'Playfair Display',serif",
      'font-size': '14',
      'font-weight': '700',
      fill: '#3D2B1F',
    }, svg);
    ce.textContent = r.company;

    // Role title
    const te = el('text', {
      x: lx + 14, y: ty + 39,
      'font-family': 'Nunito,sans-serif',
      'font-size': '10.5',
      'font-weight': '600',
      fill: '#5A4033',
    }, svg);
    te.textContent = r.title;

    // Year range
    const ye = el('text', {
      x: lx + 14, y: ty + 54,
      'font-family': 'Nunito,sans-serif',
      'font-size': '9',
      'font-weight': '600',
      fill: '#9A8070',
    }, svg);
    ye.textContent = r.years;

    // Current role: pulsing dot (two circles for halo effect)
    if (r.current) {
      el('circle', { cx: lx + CW - 14, cy: ty + 14, r: '7',  fill: r.color, opacity: '.22' }, svg);
      el('circle', { cx: lx + CW - 14, cy: ty + 14, r: '3.5', fill: r.color }, svg);
    }
  });

})();
</script>
</body>
</html>
